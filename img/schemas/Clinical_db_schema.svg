<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 970" style="background-color: #f8f9fa;">
  <defs>
    <!-- Gradient definitions -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f4c75;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bbe1fa;stop-opacity:0.3" />
    </linearGradient>

    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fff3cd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fffaeb;stop-opacity:1" />
    </linearGradient>

    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#0f4c75" />
    </marker>

    <!-- Filter for shadow -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Title -->
  <rect x="0" y="0" width="1200" height="60" fill="url(#headerGrad)"/>
  <text x="600" y="38" font-family="Playfair Display, serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Clinical Database Discovery &amp; Documentation
  </text>

  <!-- Subtitle -->
  <text x="600" y="85" font-family="Work Sans, sans-serif" font-size="16" fill="#636e72" text-anchor="middle">
    Patient Discovery via Recursive JSON Path Search
  </text>

  <!-- Layer 1: User Input -->
  <g id="user-input">
    <rect x="50" y="120" width="280" height="100" rx="8" fill="url(#cardGrad)" filter="url(#shadow)" stroke="#3282b8" stroke-width="2"/>
    <text x="190" y="150" font-family="Work Sans, sans-serif" font-size="18" font-weight="600" fill="#0f4c75" text-anchor="middle">
      👨‍⚕️ Research Question
    </text>
    <text x="190" y="175" font-family="Work Sans, sans-serif" font-size="13" fill="#2d3436" text-anchor="middle">
      Clinical Data Specialist
    </text>
    <text x="190" y="195" font-family="Work Sans, sans-serif" font-size="13" fill="#636e72" text-anchor="middle">
      "Which patients have
    </text>
    <text x="190" y="210" font-family="Work Sans, sans-serif" font-size="13" fill="#636e72" text-anchor="middle">
      'ventilation' documented?"
    </text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 330 170 L 420 170" stroke="#0f4c75" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Layer 2: PostgreSQL Recursive Function -->
  <g id="function">
    <rect x="420" y="120" width="390" height="200" rx="8" fill="url(#cardGrad)" filter="url(#shadow)" stroke="#3282b8" stroke-width="3"/>
    <text x="600" y="150" font-family="Work Sans, sans-serif" font-size="18" font-weight="600" fill="#0f4c75" text-anchor="middle">
      🔄 Recursive PostgreSQL Function
    </text>

    <!-- Function steps -->
    <rect x="440" y="165" width="350" height="30" rx="4" fill="#bbe1fa" opacity="0.3"/>
    <text x="450" y="185" font-family="Work Sans, sans-serif" font-size="12" fill="#1a1a2e">
      Step 1: Scan the relevant table with the JSON column "content"
    </text>

    <rect x="440" y="200" width="350" height="30" rx="4" fill="#bbe1fa" opacity="0.5"/>
    <text x="450" y="220" font-family="Work Sans, sans-serif" font-size="12" fill="#1a1a2e">
      Step 2: For each record, traverse JSON recursively
    </text>

    <rect x="440" y="235" width="350" height="30" rx="4" fill="#bbe1fa" opacity="0.7"/>
    <text x="450" y="255" font-family="Work Sans, sans-serif" font-size="12" fill="#1a1a2e">
      Step 3: Build JSON path when match found
    </text>

    <rect x="440" y="270" width="350" height="30" rx="4" fill="#3282b8"/>
    <text x="450" y="290" font-family="Work Sans, sans-serif" font-size="12" fill="#ffffff">
      Step 4: Return (patnr, fallnr, path) tuple
    </text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 600 320 L 600 380" stroke="#0f4c75" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Layer 3: Database Structure -->
  <g id="database">
    <rect x="350" y="380" width="500" height="200" rx="8" fill="url(#cardGrad)" filter="url(#shadow)" stroke="#3282b8" stroke-width="2"/>
    <text x="600" y="410" font-family="Work Sans, sans-serif" font-size="18" font-weight="600" fill="#0f4c75" text-anchor="middle">
      🗄️ PostgreSQL Database (UKBB)
    </text>

    <!-- Tables representation -->
    <g id="table-columns">
      <rect x="370" y="425" width="210" height="140" rx="4" fill="#ffffff" stroke="#3282b8" stroke-width="1.5"/>
      <rect x="370" y="425" width="210" height="30" rx="4" fill="#0f4c75"/>
      <text x="475" y="445" font-family="Work Sans, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">
        Regular Columns
      </text>
      <text x="380" y="475" font-family="Courier New, monospace" font-size="11" fill="#2d3436">
        • patnr (Patientennr.)
      </text>
      <text x="380" y="495" font-family="Courier New, monospace" font-size="11" fill="#2d3436">
        • fallnr (Fallnummer)
      </text>
      <text x="380" y="515" font-family="Courier New, monospace" font-size="11" fill="#2d3436">
        • department
      </text>
      <text x="380" y="535" font-family="Courier New, monospace" font-size="11" fill="#2d3436">
        • admission_date
      </text>
      <text x="380" y="555" font-family="Courier New, monospace" font-size="11" fill="#636e72">
        • ... (other fields)
      </text>
    </g>

    <!-- JSON Column -->
    <g id="json-column">
      <rect x="615" y="425" width="220" height="140" rx="4" fill="#ffffff" stroke="#e17055" stroke-width="2"/>
      <rect x="615" y="425" width="220" height="30" rx="4" fill="#e17055"/>
      <text x="725" y="445" font-family="Work Sans, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">
        JSON Column (JSONB)
      </text>
      <text x="625" y="475" font-family="Courier New, monospace" font-size="10" fill="#2d3436">
        clinical_data: {
      </text>
      <text x="635" y="490" font-family="Courier New, monospace" font-size="10" fill="#636e72">
          "procedures": {
      </text>
      <text x="645" y="505" font-family="Courier New, monospace" font-size="10" fill="#0f4c75">
              "ventilation": {
      </text>
      <text x="655" y="520" font-family="Courier New, monospace" font-size="10" fill="#00b894">
                  "mode": "AC/VC"
      </text>
      <text x="645" y="535" font-family="Courier New, monospace" font-size="10" fill="#0f4c75">
              }
      </text>
      <text x="635" y="550" font-family="Courier New, monospace" font-size="10" fill="#636e72">
          }
      </text>
      <text x="625" y="565" font-family="Courier New, monospace" font-size="10" fill="#2d3436">
        }
      </text>
    </g>
  </g>

  <!-- Arrow 3 -->
  <path d="M 600 580 L 600 640" stroke="#0f4c75" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Layer 4: Output - THREE-PART RESULT -->
  <g id="output">
    <rect x="50" y="640" width="1100" height="220" rx="8" fill="url(#cardGrad)" filter="url(#shadow)" stroke="#00b894" stroke-width="3"/>
    <text x="600" y="670" font-family="Work Sans, sans-serif" font-size="18" font-weight="600" fill="#0f4c75" text-anchor="middle">
      📊 Three-Part Discovery Results
    </text>

    <!-- Combined output table showing all three components -->
    <rect x="70" y="685" width="1060" height="160" rx="4" fill="#ffffff" stroke="#00b894" stroke-width="2"/>
    <rect x="70" y="685" width="1060" height="35" rx="4" fill="#00b894"/>

    <!-- Table headers -->
    <text x="120" y="710" font-family="Work Sans, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">
      patnr
    </text>
    <text x="300" y="710" font-family="Work Sans, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">
      fallnr
    </text>
    <text x="700" y="710" font-family="Work Sans, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">
      path (JSON key path)
    </text>

    <!-- Vertical dividers -->
    <line x1="200" y1="685" x2="200" y2="845" stroke="#00b894" stroke-width="1" opacity="0.3"/>
    <line x1="400" y1="685" x2="400" y2="845" stroke="#00b894" stroke-width="1" opacity="0.3"/>

    <!-- Row 1 -->
    <rect x="70" y="720" width="1060" height="35" fill="#f0f8ff" opacity="0.5"/>
    <text x="120" y="743" font-family="Courier New, monospace" font-size="11" fill="#2d3436" text-anchor="middle">
      412541
    </text>
    <text x="300" y="743" font-family="Courier New, monospace" font-size="11" fill="#2d3436" text-anchor="middle">
      5193452
    </text>
    <text x="440" y="743" font-family="Courier New, monospace" font-size="11" fill="#0f4c75" text-anchor="start">
      .procedures.respiratory.ventilation.mode
    </text>

    <!-- Row 2 -->
    <rect x="70" y="755" width="1060" height="35" fill="#ffffff"/>
    <text x="120" y="778" font-family="Courier New, monospace" font-size="11" fill="#2d3436" text-anchor="middle">
      387629
    </text>
    <text x="300" y="778" font-family="Courier New, monospace" font-size="11" fill="#2d3436" text-anchor="middle">
      5201103
    </text>
    <text x="440" y="778" font-family="Courier New, monospace" font-size="11" fill="#0f4c75" text-anchor="start">
      .interventions.ventilation.settings
    </text>

    <!-- Row 3 -->
    <rect x="70" y="790" width="1060" height="35" fill="#f0f8ff" opacity="0.5"/>
    <text x="120" y="813" font-family="Courier New, monospace" font-size="11" fill="#2d3436" text-anchor="middle">
      401258
    </text>
    <text x="300" y="813" font-family="Courier New, monospace" font-size="11" fill="#2d3436" text-anchor="middle">
      5189773
    </text>
    <text x="440" y="813" font-family="Courier New, monospace" font-size="11" fill="#0f4c75" text-anchor="start">
      .care_plan[0].ventilation_protocol
    </text>

    <!-- Row 4 - continuation indicator -->
    <text x="600" y="835" font-family="Work Sans, sans-serif" font-size="11" fill="#636e72" text-anchor="middle">
      ... (continues for all matching patients)
    </text>
  </g>

  <!-- Key Insight Box -->
  <g id="insight">
    <rect x="100" y="880" width="1000" height="60" rx="8" fill="url(#yellowGrad)" filter="url(#shadow)" stroke="#ffc107" stroke-width="2"/>

    <text x="120" y="905" font-family="Work Sans, sans-serif" font-size="13" fill="#1a1a2e" font-weight="600">
      💡 Three Essential Pieces of Information:
    </text>
    <text x="140" y="925" font-family="Work Sans, sans-serif" font-size="12" fill="#2d3436">
      1️⃣ WHO has the data (patnr = Patientennummer)  •  2️⃣ WHICH case (fallnr = Fallnummer)  •  3️⃣ WHERE it's located (JSON key path)
    </text>
  </g>

  <!-- Note about German terms -->
  <text x="600" y="960" font-family="Work Sans, sans-serif" font-size="10" fill="#636e72" text-anchor="middle" font-style="italic">
    UKBB (Universitätsspital Basel) uses German medical terminology
  </text>
</svg>